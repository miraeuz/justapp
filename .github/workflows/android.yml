name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: co
        uses: actions/checkout@v4
      - id: jv
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - id: gr
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - id: bd
        name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Report
        if: always()
        run: |
          echo "::notice title=step outcomes::checkout=${{ steps.co.outcome }} java=${{ steps.jv.outcome }} gradle=${{ steps.gr.outcome }} build=${{ steps.bd.outcome }}"
          if [ -f build.log ]; then
            msg=$(grep -nE "^e: |error:|FAILED|What went wrong|Could not|Execution failed" -A3 build.log | head -45 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$msg" ]; then echo "::warning title=Log hints::$msg"; fi
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AttestKit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Attest Kit (latest APK)
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
