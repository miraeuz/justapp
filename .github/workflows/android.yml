name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Show Kotlin/Gradle errors
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80
      - uses: actions/upload-artifact@v4
        with: { name: AttestKit-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Attest Kit (latest APK)
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
